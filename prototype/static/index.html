<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MEDRESQ</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0e6b6f">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#edf2f1;--panel:#fff;--ink:#12262b;--mut:#587077;--line:#d3dedc;--teal:#0e6b6f;--teal2:#0b565a;--soft:#e3eeec;
--red:#d6382c;--amber:#e8a21a;--green:#2f8f63;--rail:#12262b;--railink:#d7e6e4;--field:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0c1719;--panel:#122326;--ink:#e6f0ef;--mut:#92aaae;--line:#223a3e;--soft:#183135;--teal:#3fb3b0;--teal2:#2c8f8c;--rail:#08110f;--field:#0f1f22}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);display:grid;grid-template-columns:232px 1fr;min-height:100vh;font-variant-numeric:tabular-nums}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
aside{background:var(--rail);color:var(--railink);padding:22px 14px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh}
.brand{padding:0 8px}.brand b{display:block;font-size:22px;letter-spacing:.2px;color:#fff;font-weight:700}
.brand span{font-size:12.5px;line-height:1.35;color:#8fb0ac;display:block;margin-top:2px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{border:0;background:none;color:var(--railink);padding:10px 12px;font:inherit;font-weight:560;cursor:pointer;text-align:left;border-radius:8px;border-left:3px solid transparent}
nav button:hover{background:rgba(255,255,255,.06)}
nav button.on{background:rgba(63,179,176,.16);color:#fff;border-left-color:#3fb3b0}
.clock{margin-top:auto;padding:14px 12px;border-radius:10px;background:rgba(255,255,255,.05)}
.clock small{display:block;color:#8fb0ac;font-size:12px}.clock b{font-size:34px;line-height:1.1;color:#fff;font-weight:650}
.clock .go{display:flex;gap:6px;margin-top:10px}
.clock button{flex:1;border:1px solid rgba(255,255,255,.22);background:none;color:#fff;border-radius:7px;padding:7px 0;font:inherit;font-weight:600;cursor:pointer}
.clock button:hover{background:rgba(255,255,255,.1)}
.sim{padding:8px 12px;border-radius:8px;font-size:12px;font-weight:700;color:#1b1300;background:repeating-linear-gradient(135deg,#e8a21a 0 10px,#f0b73f 10px 20px);text-align:center}
.shell{min-width:0}
main{max-width:1180px;margin:0 auto;padding:26px 32px 70px}
.status{display:flex;flex-wrap:wrap;gap:0;margin-bottom:22px;border-bottom:1px solid var(--line)}
.status div{padding:2px 28px 14px 0;margin-right:28px;border-right:1px solid var(--line)}
.status div:last-child{border-right:0}
.status small{display:block;color:var(--mut);font-size:12.5px}.status b{font-size:24px;font-weight:650}.status b.red{color:var(--red)}
h2.page{font-size:26px;margin:0 0 14px;font-weight:650;letter-spacing:-.2px}
.lede{color:var(--mut);margin:-8px 0 20px;max-width:68ch}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}
.card h3{margin:0 0 10px;font-size:17px;font-weight:650}
.row{display:flex;gap:22px;flex-wrap:wrap}.row>*{flex:1 1 320px}
button.btn,a.btn{background:var(--teal);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer;display:inline-block}
button.btn:hover{background:var(--teal2)}
button.btn.alt,a.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.btn.alt:hover{background:var(--soft)}
button.btn.ok{background:var(--green)}button.btn.no{background:transparent;color:var(--red);border:1px solid var(--red)}
button:disabled{opacity:.5;cursor:default}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12.5px}
td.n,th.n{text-align:right}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{background:var(--soft);border-radius:6px;padding:2px 9px;font-size:12.5px}
.chip.warn{background:#fbe3e0;color:#8a2219}
.muted{color:var(--mut)}.note{font-size:13px;color:var(--mut)}
.heat{overflow:auto;max-height:470px}
.heat table{border-collapse:separate;border-spacing:2px;font-size:11px;width:auto}
.heat td{padding:0;border:0;width:20px;height:22px;min-width:20px;border-radius:4px;text-align:center;font-size:10px;color:rgba(0,0,0,.55);vertical-align:middle}
.heat th{padding:0 6px 0 0;border:0;font-size:11px;color:var(--mut);position:sticky;left:0;background:var(--panel);text-align:right}
.heat tr:first-child th{position:sticky;top:0;text-align:center;padding:0 0 3px;z-index:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sl{display:grid;grid-template-columns:160px 1fr 50px;gap:10px;align-items:center;margin:8px 0}
input[type=range]{accent-color:var(--teal);padding:0}
.good{color:var(--green);font-weight:700}.bad{color:var(--red);font-weight:700}
/* transfer slip */
.slip{display:grid;grid-template-columns:230px 1fr;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
.slip.done{opacity:.6}
.route{background:var(--soft);padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-right:2px dashed var(--line)}
.node{text-align:center}.node b{display:block;font-size:20px;font-weight:700}.node small{color:var(--mut);font-size:12px}
.pipe{display:flex;flex-direction:column;align-items:center;gap:2px}
.pipe i{display:block;width:2px;height:16px;background:var(--teal)}
.pipe .qty{font-size:30px;font-weight:700;color:var(--teal);line-height:1}.pipe small{color:var(--mut);font-size:12px}
.slip .body{padding:18px 20px}.slip h4{margin:0 0 4px;font-size:18px;font-weight:650}
.slip .fig{display:flex;gap:26px;flex-wrap:wrap;margin:12px 0 4px}
.fig small{display:block;color:var(--mut);font-size:12px}.fig b{font-size:19px;font-weight:650}.fig b.net{color:var(--green)}
.slip .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.stop{background:var(--panel);border:1px solid var(--red);border-left:6px solid var(--red);border-radius:12px;padding:16px 20px;margin-bottom:16px}
.stop h4{margin:0 0 4px;font-size:17px}
@media(max-width:1000px){.row[style*=nowrap]{flex-wrap:wrap!important}.row[style*=nowrap]>div:first-child{flex:1 1 100%!important}}
@media(max-width:820px){body{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
nav{flex-direction:row;overflow-x:auto}.clock{margin:0}main{padding:18px 16px 60px}.slip{grid-template-columns:1fr}.route{flex-direction:row;border-right:0;border-bottom:2px dashed var(--line)}.pipe{flex-direction:row}.pipe i{width:16px;height:2px}.sl{grid-template-columns:110px 1fr 40px}}

/* ---------- map ---------- */
.mapwrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:20px;height:560px;background:var(--panel)}
.mapwrap.short{height:420px}
.gm{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;user-select:none;
 background:#e6ece7 linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px) 0 0/48px 48px}
.gm.drag{cursor:grabbing}
.m-tiles img{position:absolute;left:0;top:0;width:256px;height:256px;max-width:none;pointer-events:none}
.m-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.m-lines path{fill:none;stroke:#0e6b6f;stroke-width:3;stroke-linecap:round;stroke-dasharray:7 7;opacity:.85}
.m-lines path.hl{stroke-width:5;opacity:1;stroke:#0b565a}
@media (prefers-reduced-motion:no-preference){.m-lines path.hl{animation:flow 1s linear infinite}}
@keyframes flow{to{stroke-dashoffset:-14}}
.m-pins{position:absolute;inset:0;pointer-events:none}
.pin{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer}
.pin .dot{position:absolute;display:grid;place-items:center;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);color:#fff;transform:translate(-50%,-50%);transition:transform .15s}
.pin .dot::before,.pin .dot::after{content:"";position:absolute;background:#fff;border-radius:2px}
.pin .dot::before{width:34%;height:12%}.pin .dot::after{width:12%;height:34%}
.pin.hit .dot{outline:3px dashed #e8a21a;outline-offset:3px}
.pin.sel .dot{transform:translate(-50%,-50%) scale(1.22);box-shadow:0 4px 16px rgba(0,0,0,.5)}
.pin .lbl{position:absolute;transform:translate(-50%,0);top:var(--r);margin-top:6px;background:#fff;color:#12262b;font-weight:700;font-size:12px;padding:1px 7px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);white-space:nowrap}
.pin .bd{position:absolute;left:var(--r);top:calc(var(--r) * -1);background:#d6382c;color:#fff;border:2px solid #fff;border-radius:99px;font-size:11px;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;transform:translate(-8px,-6px);padding:0 4px}
.tag{position:absolute;transform:translate(-50%,-50%);background:#0e6b6f;color:#fff;font-weight:700;font-size:12px;padding:2px 9px;border-radius:99px;box-shadow:0 1px 6px rgba(0,0,0,.35);pointer-events:none;white-space:nowrap}
.tag.hl{background:#0b565a;transform:translate(-50%,-50%) scale(1.15)}
.m-zoom{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.m-zoom button{width:38px;height:38px;border:0;background:#fff;color:#12262b;font-size:20px;cursor:pointer}
.m-zoom button+button{border-top:1px solid #dfe6e4}
.m-zoom button:hover{background:#eef3f2}
.m-attr{position:absolute;left:8px;bottom:4px;font-size:10.5px;color:#41545a;background:rgba(255,255,255,.75);padding:0 6px;border-radius:4px}
.maplegend{position:absolute;left:64px;top:14px;right:330px;background:#fff;color:#12262b;border-radius:12px;padding:9px 14px;box-shadow:0 2px 10px rgba(0,0,0,.25);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}
.maplegend span{display:flex;align-items:center;gap:8px}.maplegend i{width:13px;height:13px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.maplegend small{color:#587077}
.drawer{position:absolute;top:14px;right:14px;bottom:14px;width:300px;background:var(--panel);border-radius:14px;box-shadow:0 6px 28px rgba(0,0,0,.28);padding:18px;overflow:auto}
.drawer h3{margin:6px 0 0;font-size:22px}.drawer h4{margin:16px 0 6px;font-size:14px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;color:#fff}
.badge.risk{background:#d6382c}.badge.watch{background:#c98400}.badge.ok{background:#2f8f63}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.kv small{display:block;color:var(--mut);font-size:12px}.kv b{font-size:19px}
.need{list-style:none;margin:0;padding:0}.need li{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.need li b{color:var(--red)}.need .crit{font-size:11px;background:#fbe3e0;color:#8a2219;border-radius:5px;padding:0 6px;margin-left:6px}
.banner{display:flex;gap:12px;align-items:center;background:#fff4dc;color:#5c3d00;border:1px solid #f0cf86;border-radius:12px;padding:10px 16px;margin-bottom:16px;font-weight:560}
.banner.calm{background:var(--soft);color:var(--ink);border-color:var(--line)}
.banner .pulse{width:10px;height:10px;border-radius:50%;background:#e8a21a;flex:none}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 16px}
.heat tr.sel th{color:var(--ink);font-weight:800}.heat tr.sel td{outline:2px solid var(--ink);outline-offset:-2px}
.heat th.rowh{cursor:pointer}
@media(max-width:900px){.mapwrap{height:auto;display:flex;flex-direction:column}.mapwrap .gm{position:relative;height:380px}.drawer{position:static;width:auto;box-shadow:none;border-radius:0}.maplegend{display:none}}

.imp{display:grid;grid-template-columns:150px 1fr 150px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.imp .track{position:relative;height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.imp .track i{position:absolute;top:0;bottom:0}
.imp .b{left:0;background:#7aa9ad}.imp .up{background:var(--green)}.imp .down{background:var(--amber)}
.imp b{text-align:right}
.headline{border-left:6px solid var(--teal);padding:4px 0 4px 16px;margin:0 0 20px;font-size:21px;line-height:1.35;font-weight:600}
.headline small{display:block;font-size:13px;font-weight:400;color:var(--mut);margin-top:2px}
#tour{position:fixed;bottom:20px;left:calc(232px + (100vw - 232px)/2);transform:translateX(-50%);z-index:50;background:var(--rail);color:#fff;border-radius:14px;padding:14px 18px;width:min(680px,calc(100vw - 280px));box-shadow:0 10px 34px rgba(0,0,0,.4);display:none}
#tour.on{display:block}
body:has(#tour.on) main{padding-bottom:230px}
#tour .st{font-size:12px;color:#8fb0ac}#tour p{margin:2px 0 10px;font-size:15.5px}
#tour .act{display:flex;gap:8px;align-items:center}#tour button{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:8px;padding:6px 14px;font:inherit;cursor:pointer}
#tour button.pri{background:#3fb3b0;border-color:#3fb3b0;color:#06201f;font-weight:700}
.tourbtn{border:1px solid #3fb3b0;background:none;color:#bfe9e6;border-radius:8px;padding:9px;font:inherit;font-weight:600;cursor:pointer}
.tourbtn:hover{background:rgba(63,179,176,.15)}
@media(max-width:820px){#tour{left:50%;width:calc(100vw - 28px)}}

/* ---------- v4: story-first design ---------- */
.pin .dot::before,.pin .dot::after{display:none}
.pin .dot{position:absolute;left:0;top:0;width:auto;height:auto;border:0;background:none;box-shadow:none;border-radius:0;outline:0!important;transform:translate(-50%,-50%);overflow:visible;transition:transform .15s}
.pin.sel .dot{transform:translate(-50%,-50%) scale(1.2);box-shadow:none}
.pin.lr .lbl{left:calc(var(--r) + 2px);top:-10px;transform:none;margin-top:0}
.pin.ll .lbl{right:calc(var(--r) + 2px);left:auto;top:-10px;transform:none;margin-top:0}
.pin .lbl{margin-top:2px;font-size:11.5px}
.m-lines .pill{fill:#fff;stroke:#0b565a;stroke-width:3}
.m-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:16px;padding:22px 26px;margin-bottom:16px;color:#fff;background:linear-gradient(120deg,#12262b 0%,#0e6b6f 100%)}
.hero.bad{background:linear-gradient(120deg,#3a1613 0%,#a62d24 100%)}
.hero h2{margin:0 0 4px;font-size:26px;line-height:1.2;font-weight:650;letter-spacing:-.2px;max-width:30ch}
.hero p{margin:0;opacity:.88;max-width:60ch}
.hero .btn{background:#fff;color:#12262b;padding:12px 20px;font-size:15px}.hero .btn:hover{background:#e3eeec}
.sect{font-size:17px;font-weight:650;margin:22px 0 4px}
.sub{color:var(--mut);margin:0 0 12px;font-size:13.5px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:8px}
.wc{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--ink);display:grid;gap:3px}
.wc:hover{border-color:var(--teal)}.wc b{font-size:15px}.wc small{color:var(--mut)}.wc strong{font-size:18px;color:var(--red)}
.wc .meter{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin:4px 0}.wc .meter i{display:block;height:100%;background:var(--red)}
.crit{font-size:11px;background:#fbe3e0;color:#8a2219;border-radius:5px;padding:0 6px;margin-left:6px;font-weight:600}
details.card summary{cursor:pointer;font-weight:650;font-size:16px}
.sug{margin:0;padding-left:18px}.sug li{margin:4px 0;font-size:14px}
.why{font-size:15.5px;margin:2px 0 6px}.why b{color:var(--red)}.why b.g{color:var(--green)}
.small-d{font-size:12.5px;color:var(--mut);margin-top:6px}
.cb{display:grid;grid-template-columns:200px 1fr;gap:12px;align-items:center;margin:8px 0;font-size:13.5px}
.cb .bars{display:grid;gap:3px}.cb .bars div{display:flex;align-items:center;gap:8px}.cb i{display:block;height:11px;border-radius:99px}
.cb .a{background:#aebcbe}.cb .c{background:var(--teal)}.cb em{font-style:normal;font-size:12px;color:var(--mut);min-width:60px}
.ar{direction:rtl;text-align:right;font-family:"Segoe UI","Tahoma",system-ui,sans-serif;line-height:1.85}
.ar h2{font-size:30px;margin:0 0 6px}.ar h3{font-size:20px}
.steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-top:10px}
.steps4>div{background:var(--soft);border-radius:12px;padding:14px}.steps4 b{display:block;font-size:16px;margin-bottom:2px}
.steps4 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--teal);color:#fff;font-weight:700;margin-bottom:6px}
.ar table th{text-align:right}.ar .legendrow{display:flex;gap:20px;flex-wrap:wrap}.ar .legendrow span{display:flex;align-items:center;gap:8px}
.ar .dotc{width:16px;height:16px;border-radius:50%;display:inline-block}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

.sum h3{margin:0 0 8px;font-size:19px}.sum p{margin:6px 0}.sum ul{margin:6px 0 0;padding-left:20px}.sum li{margin:4px 0}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin:0 0 18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.keys>div{padding:14px 18px 14px 0;margin-right:18px;border-right:1px solid var(--line)}.keys>div:last-child{border-right:0}
.keys b{display:block;font-size:30px;font-weight:650;line-height:1.1}.keys small{color:var(--mut);display:block;margin-top:4px;font-size:13px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
.flow>div{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px}.flow b{display:block;font-size:15px;margin-bottom:2px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.pol{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px}.pol b{font-weight:650}

/* ---------- overview ---------- */
.logo{display:flex;align-items:center;gap:10px}.logo svg{flex:none}
.ov{max-width:1020px;margin:0 auto}
.ovhero{position:relative;overflow:hidden;border-radius:22px;padding:40px 44px;color:#fff;background:radial-gradient(120% 140% at 85% 20%,#14878c 0%,#0e6b6f 35%,#12262b 100%);display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:center;margin-bottom:34px}
.ovhero h1{margin:0 0 12px;font-size:38px;line-height:1.08;letter-spacing:-.8px;font-weight:700}
.ovhero p{margin:0 0 16px;font-size:16.5px;opacity:.9;max-width:46ch}
.ovhero .tags{display:flex;gap:8px;flex-wrap:wrap}.ovhero .tags span{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:3px 12px;font-size:12.5px}
.ovhero svg.art{width:100%;height:auto;max-height:260px}
.ovsec{margin:0 0 38px}
.ovsec>h2{margin:0 0 6px;font-size:25px;letter-spacing:-.3px;font-weight:700}
.ovsec>p.lead{margin:0 0 16px;color:var(--mut);max-width:70ch;font-size:15.5px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.vs>div{border-radius:16px;padding:20px 22px}.vs .old{background:var(--soft)}.vs .new{background:var(--teal);color:#fff}
.vs h3{margin:0 0 8px;font-size:17px}.vs ul{margin:0;padding-left:18px}.vs li{margin:5px 0}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s}

/* ---- motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.35);opacity:0}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes fillx{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@keyframes growx{from{transform:scaleX(0);transform-origin:left}to{transform:scaleX(1);transform-origin:left}}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes toastin{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(14,107,111,0)}30%{box-shadow:0 0 0 6px rgba(14,107,111,.35)}}
@keyframes pl{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes drift{from{background-position:0 0}to{background-position:46px 46px}}
@keyframes shine{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-24deg)}50%{transform:translateY(-8px) rotate(-18deg)}}
main>*{animation:rise .55s both}main>*:nth-child(2){animation-delay:.06s}main>*:nth-child(3){animation-delay:.12s}main>*:nth-child(4){animation-delay:.18s}main>*:nth-child(5){animation-delay:.24s}main>*:nth-child(n+6){animation-delay:.3s}
.wcard,.slip,.wc,.svc{animation:rise .5s both}.wcard:nth-of-type(2),.slip:nth-of-type(2){animation-delay:.08s}.wcard:nth-of-type(3),.slip:nth-of-type(3){animation-delay:.16s}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.1s ease-out infinite}
.hero,.ovhero{background-size:220% 220%;animation:shine 14s ease infinite}
.hero::before,.ovhero::before{content:"";position:absolute;inset:0;z-index:0;opacity:.16;background-image:radial-gradient(circle at 12px 12px,#fff 0 6px,transparent 7px),radial-gradient(circle at 35px 35px,#fff 0 3px,transparent 4px);background-size:46px 46px;animation:drift 9s linear infinite;-webkit-mask-image:linear-gradient(90deg,transparent,#000 55%);mask-image:linear-gradient(90deg,transparent,#000 55%)}

.card::after{content:"\211E";position:absolute;right:16px;top:8px;font-size:44px;line-height:1;color:var(--teal);opacity:.07;pointer-events:none;font-family:"Segoe UI Symbol","Noto Sans Symbols",serif}

.nav-ic{transition:transform .25s}nav button:hover .nav-ic{transform:rotate(-12deg) scale(1.15)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

he app shows \"check by hand\" and asks for a count instead of recommending on bad data.", ""], "Hard safety limits": ["The sender keeps a reserve of days of stock, and transferred stock needs at least 30 days of shelf life. Controlled medicines can be excluded, and cold-chain medicines need a confirmation of cold transport.", ""], "Plain explanations": ["Each reason is a sentence template filled with the solver's own numbers, so it cannot invent facts.", ""], "Full audit log": ["Every request, confirmation, refusal and shipment is recorded with time, role and note, and can be exported as CSV or a PDF report.", ""], "Cost-aware": ["A transfer costs money and can leave the sender short. MEDRESQ weighs the shortage avoided against both before it suggests anything.", ""], "No real-world validation": ["The numbers come from a simulation on invented data. They show how the method behaves, not what a real hospital would save.", "Next step: replace assumptions with figures from pharmacist interviews, then test on read-only data."], "Assumed costs": ["Prices, expiry cost, transfer cost and shortage penalty are assumptions. In Settings you can change them and see the saving change.", ""], "Simplified disruptions": ["The model has only two shocks: late shipments and a demand jump. Real life also has emergency buying, substitutions and recalls.", ""], "Approval is in the app only": ["Real transfers also need each organisation's legal and regulatory approval. The app records agreement, it does not replace the rules.", ""], "Listen": ["Interview pharmacists and warehouse managers and replace the assumed numbers with real ones.", "Ask: how often do you run out, what expires unused, and how do you arrange a transfer today?"], "Check the rules": ["Ask the regulator how transfers between sites must be approved and recorded, and which medicines are never allowed to move.", ""], "Pilot read-only": ["Connect to one network's stock data, show recommendations, and compare them with what async function pitchGo(i){if(!PT)return;if(i<0)return;if(i>=PITCH.length){pitchEnd();return}
  clearTimeout(PT.timer);(PT.acts||[]).forEach(clearTimeout);PT.acts=[];PT.i=i;const tok=++PT.tok,s=PITCH[i];PT.started=performance.now();PT.left=s.ms;pitchBar();
  try{await s.run()}catch(e){}if(!PT||tok!=PT.tok)return;
  (s.acts||[]).forEach(a=>PT.acts.push(setTimeout(()=>{if(PT&&tok==PT.tok&&!PT.paused)a.fn()},a.at/PT.speed)));pitchSchedule(tok)}
function pitchSchedule(tok){if(!PT||PT.paused)return;clearTimeout(PT.timer);PT.started=performance.now();PT.timer=setTimeout(()=>{if(PT&&tok==PT.tok)pitchGo(PT.i+1)},PT.left/PT.speed)}
function pitchPause(){if(!PT)return;PT.paused=!PT.paused;if(PT.paused){clearTimeout(PT.timer);PT.left=Math.max(500,PT.left-(performance.now()-PT.started)*PT.speed)}else pitchSchedule(PT.tok);pitchBar()}
function pitchSpeed(){if(!PT)return;PT.speed=PT.speed==1?1.5:PT.speed==1.5?0.7:1;clearTimeout(PT.timer);pitchBar();pitchSchedule(PT.tok)}
function pitchEnd(){if(!PT)return;clearTimeout(PT.timer);(PT.acts||[]).forEach(clearTimeout);PT=null;$("#pitch").className="";$("#pitch").innerHTML="";$("#shield").className=""}

  const v=r.cover||{},recv=r.side=="receive",b=recv?v.dst_before:v.src_before,a=recv?v.dst_after:v.src_after;

   ${stp}${msg?`<p class="wait"><span class="dots"><i></i><i></i><i></i></span>${msg}</p>`:""}
   ${(r.me_ok||ro||r.status!="pending")?"":`<div class="acts">${recv?`<button class="btn ok" onclick="siteAct(${r.id},'${r.dst}','accept')">Request it</button><button class="btn no" onclick="siteAct(${r.id},'${r.dst}','decline')">No thanks</button>`
   :`<button class="btn ok" onclick="siteAct(${r.id},'${r.src}','accept')">Send it</button><input id="sq${r.id}" type="number" min="1" max="${r.qty}" value="${r.qty}" style="width:80px" aria-label="Quantity"><button class="btn alt" onclick="siteAct(${r.id},'${r.src}','accept',+$('#sq${r.id}').value)">Send fewer</button><button class="btn no" onclick="siteAct(${r.id},'${r.src}','decline')">Can't spare</button>`}</div>`}</div></div>`}

async function siteAct(id,site,action,qty,cold){const r=await api("/api/site_action",{id,site,action,qty,cold_ok:!!cold});
  if(r.error&&/^Cold-chain transport/.test(r.error)){if(confirm(window.__lang&&window.__lang()=="ar"?"هذا الدواء يحتاج نقلًا مبرّدًا. هل تؤكد أنك تستطيع إرساله مبرّدًا؟":"This medicine needs cold-chain transport. Do you confirm that you can send it refrigerated?"))return siteAct(id,site,action,qty,true);return}
  if(r.error){toast(r.error,false);const c=$("#wc"+id);if(c&&r.error=="This request is no longer open"){c.classList.add("gone");setTimeout(centers,650)}else if(!c||r.error!="This request is no longer open")centers();return}
  toast(r.state=="shipped"?"Both centers agreed. Shipped!":r.state=="declined"?"Declined.":r.state=="failed"?"Agreed, but the stock was not available.":"Confirmed. Waiting for the other center.",r.state!="failed");centers()}
/* count-up for the big numbers */
function countUp(root){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;(root||document).querySelectorAll(".status b,.svc b").forEach(el=>{if(el.dataset.cu)return;el.dataset.cu=1;const t=el.textContent,m=t.match(/[\d][\d,]*\.?\d*/);if(!m)return;const to=parseFloat(m[0].replace(/,/g,"")),dec=(m[0].split(".")[1]||"").length,pre=t.slice(0,m.index),suf=t.slice(m.index+m[0].length),t0=performance.now();
  const f=n=>{const k=Math.min(1,(n-t0)/800),e=1-Math.pow(1-k,3);el.textContent=pre+(to*e).toLocaleString("en-US",{minimumFractionDigits:dec,maximumFractionDigits:dec})+suf;if(k<1)requestAnimationFrame(f);else el.textContent=t};requestAnimationFrame(f)})}
async function savings(){
  RES=await api("/api/results");
  if(!RES.summary){$("#main").innerHTML=`<div class="card"><h3>Savings dashboard</h3><p>No experiment results found. Run <code>python3 run_experiments.py</code> first.</p></div>`;return}
  const S=RES.summary,P=RES.paired.filter(x=>x.metric=="total_cost");
  const byS={};S.forEach(r=>{(byS[r.scenario]=byS[r.scenario]||{})[r.policy[0]]=r});
  const names={normal:"Normal",delay:"Delay (all sites)",spike:"Spike (all sites)",local_delay:"Delay (3 of 8 sites)",local_spike:"Spike (3 of 8 sites)",local_both:"Delay and spike (3 of 8)",stale:"Stale records (15%)"};
  const rows=Object.keys(byS).map(sc=>{const a=byS[sc].A,b=byS[sc].B,c=byS[sc].C,pd=P.find(x=>x.scenario==sc);
   return `<tr><td>${names[sc]||sc}</td><td class="n">${fmt(a.total_cost)}</td><td class="n">${fmt(b.total_cost)}</td><td class="n"><b>${fmt(c.total_cost)}</b></td>
   <td class="n ${pd.diff_pct<0?"good":"bad"}">${fmt(pd.diff_pct,1)}% <span class="muted">(&plusmn;${fmt(100*pd.ci95/pd.base_mean,1)})</span></td>
   <td class="n">${fmt(a.stockout_days)} &rarr; ${fmt(c.stockout_days)}</td><td class="n">${fmt(a.expiry_loss)} &rarr; ${fmt(c.expiry_loss)}</td></tr>`}).join("");
  const AB=RES.ablation?tableAbl(RES.ablation):"";
  const SE=RES.sensitivity?tableSens(RES.sensitivity):"";
  const FB=RES.forecast?tableFore(RES.forecast):"";
  $("#main").innerHTML=`<h2 class="page">Savings</h2><p><a class="btn alt" style="text-decoration:none" href="/report" target="_blank">Weekly report (PDF)</a></p><div id="sv"></div>${headline(P)}${costBars(byS,names)}<div class="card"><h3>Total cost by scenario (${S[0].runs} simulated runs each)</h3>
  <p class="note">Mean total operating cost in JD over two simulated years, 8 sites and 30 medicines. "Change" is MEDRESQ versus site by site, paired by seed, with a 95% interval. These are simulation results under stated assumptions, not savings in real hospitals.</p>
  <table><tr><th>Scenario</th><th class="n">A: site by site</th><th class="n">B: manual transfers</th><th class="n">C: MEDRESQ</th><th class="n">C vs A</th><th class="n">Stockout days</th><th class="n">Expiry loss (JD)</th></tr>${rows}</table></div>${AB}${SE}${FB}
  <div class="card"><h3>Assumptions behind every number</h3><table>${Object.entries(RES.assumptions).map(([k,v])=>`<tr><td>${k}</td><td>${JSON.stringify(v)}</td></tr>`).join("")}</table></div>`;
}
function costBars(byS,names){const mx=Math.max(...Object.values(byS).map(v=>v.A.total_cost));
  return `<div class="card"><h3>Total cost by scenario</h3><p class="note">Grey is site by site, teal is MEDRESQ. Shorter is better. Simulated, in JD over two years.</p>${Object.keys(byS).map(sc=>`<div class="cb"><span>${names[sc]||sc}</span><div class="bars"><div><i class="a" style="width:${byS[sc].A.total_cost/mx*80}%"></i><em>${fmt(byS[sc].A.total_cost/1000,0)}k</em></div><div><i class="c" style="width:${byS[sc].C.total_cost/mx*80}%"></i><em>${fmt(byS[sc].C.total_cost/1000,0)}k</em></div></div></div>`).join("")}</div>`}
function headline(P){if(!P.length)return "";const v=P.map(x=>-x.diff_pct),lo=Math.min(...v),hi=Math.max(...v);
  return `<div class="headline">${fmt(lo,0)}% to ${fmt(hi,0)}% lower simulated total cost than site by site, in all ${P.length} scenarios.<small>Paired runs on synthetic data, 95% intervals in the table. Not a result from real hospitals.</small></div>`}
function tableAbl(A){const sc=[...new Set(A.map(r=>r.scenario))];
 const pols=[...new Set(A.map(r=>r.policy))];
 return `<div class="card"><h3>Ablation: remove one component at a time (total cost, JD)</h3><table><tr><th>Variant</th>${sc.map(s=>`<th class="n">${s}</th>`).join("")}</tr>
 ${pols.map(p=>`<tr><td>${p}</td>${sc.map(s=>{const r=A.find(x=>x.policy==p&&x.scenario==s);return `<td class="n">${r?fmt(r.total_cost):"-"}</td>`}).join("")}</tr>`).join("")}</table>
 <p class="note">Higher than C_full: the removed component was saving money. Lower than C_full: it costs money and is kept for another reason (critical-medicine coverage, protecting donor sites, expiry). See RESULTS.md.</p></div>`}
function tableSens(S){return `<div class="card"><h3>Sensitivity: fixed cost per transfer (JD)</h3><table><tr><th>Scenario</th><th>Plan</th><th class="n">Fixed cost</th><th class="n">Total cost</th><th class="n">Transfers</th></tr>
 ${S.map(r=>`<tr><td>${r.scenario}</td><td>${r.policy}</td><td class="n">${r.fixed_cost}</td><td class="n">${fmt(r.total_cost)}</td><td class="n">${fmt(r.n_transfers)}</td></tr>`).join("")}</table></div>`}
function tableFore(F){const cols=["chronic","intermittent","seasonal","all"];
 return `<div class="card"><h3>Forecast benchmark (error on next-7-day demand, lower is better)</h3><table><tr><th>Scenario</th><th>Method</th>${cols.map(c=>`<th class="n">${c}</th>`).join("")}</tr>
 ${F.map(r=>`<tr><td>${r.scenario}</td><td>${r.method}</td>${cols.map(c=>`<td class="n">${fmt(r[c],3)}</td>`).join("")}</tr>`).join("")}</table></div>`}
